<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temel Flexbox Laboratuvari</title>
    <style>
        :root {
            --bg: #edf0f4;
            --panel: #ffffff;
            --line: #d8dee6;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --green-soft: #dcfce7;
            --green: #16a34a;
            --orange-soft: #ffedd5;
            --orange: #ea580c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.35;
        }

        .wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            margin: 0 0.4vw;
            padding: 0.8vh 1vw;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .navbar {
            height: 10vh;
        }

        .navbar-main {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: clamp(0.95rem, 1.5vw, 1.2rem);
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1vw;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--muted);
            font-size: clamp(0.72rem, 1vw, 0.95rem);
            font-weight: 600;
        }

        .hero {
            height: 30vh;
        }

        .hero-main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
            gap: 1vw;
            padding-top: 0.7vh;
        }

        .hero-text,
        .hero-visual {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fbfdff;
        }

        .hero-text {
            flex: 1 1 60%;
            padding: 1.2vh 1vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.8vh;
        }

        .hero-text h1 {
            font-size: clamp(1rem, 1.8vw, 1.4rem);
        }

        .line {
            height: 0.5rem;
            border-radius: 999px;
            background: #e5e7eb;
        }

        .w-90 { width: 90%; }
        .w-75 { width: 75%; }
        .w-60 { width: 60%; }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 0.45rem 0.85rem;
            font-weight: 700;
            font-size: 0.78rem;
            width: fit-content;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .hero-visual {
            flex: 1 1 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--muted);
        }

        .cards {
            height: 30vh;
        }

        .cards-main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.9vh;
            padding-top: 0.7vh;
        }

        .card {
            flex: 1 1 calc((100% - 2vw) / 3);
            min-width: 170px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fbfdff;
            padding: 0.85vh 0.8vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.55vh;
        }

        .card h3 {
            font-size: 0.8rem;
        }

        .card .btn {
            background: #e0e7ff;
            color: #3730a3;
        }

        .grow {
            height: 20vh;
        }

        .grow-main {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: stretch;
            gap: 0.8vw;
            padding-top: 0.7vh;
        }

        .grow-item {
            flex-basis: 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0.9vh 0.9vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
        }

        .grow-item h4 {
            font-size: 0.85rem;
        }

        .grow-1 {
            flex-grow: 1;
            background: var(--primary-soft);
        }

        .grow-1 .btn {
            background: var(--primary);
            color: #ffffff;
        }

        .grow-2 {
            flex-grow: 2;
            background: var(--green-soft);
        }

        .grow-2 .btn {
            background: var(--green);
            color: #ffffff;
        }

        .grow-3 {
            flex-grow: 1;
            background: var(--orange-soft);
        }

        .grow-3 .btn {
            background: var(--orange);
            color: #ffffff;
        }

        .footer {
            height: 10vh;
        }

        .footer-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .hero-main {
                flex-direction: column;
            }

            .nav-links {
                gap: 0.7rem;
            }

            .card {
                flex: 1 1 calc(50% - 0.45vh);
            }
        }
    </style>
</head>

        <footer class="panel footer">

    </div>
</body>
</html>
