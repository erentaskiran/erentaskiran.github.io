<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafta 1 | İlk Yükleme Ekranı</title>
    <style>
        :root {
            color-scheme: light;
            --bg-1: #0d1321;
            --bg-2: #14213d;
            --glow: #fca311;
            --text-1: #f8f5ef;
            --text-2: #cfd5e3;
            --card: rgba(9, 14, 28, 0.7);
            --stroke: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background:
                radial-gradient(1200px 800px at 15% 10%, rgba(252, 163, 17, 0.18), transparent 55%),
                radial-gradient(900px 600px at 85% 90%, rgba(72, 202, 228, 0.14), transparent 50%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            color: var(--text-1);
            font-family: "Fraunces", "Iowan Old Style", "Palatino", serif;
        }

        .loading {
            width: min(520px, 100%);
            padding: 44px 36px;
            border-radius: 24px;
            background: var(--card);
            border: 1px solid var(--stroke);
            box-shadow: 0 25px 60px rgba(6, 9, 20, 0.45);
            backdrop-filter: blur(16px);
            display: grid;
            gap: 24px;
            justify-items: center;
            text-align: center;
            animation: rise 0.8s ease forwards;
        }

        .loading-text {
            display: grid;
            gap: 12px;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.28em;
            font-size: 0.72rem;
            color: var(--text-2);
        }

        h1 {
            font-size: clamp(2.4rem, 4vw, 3.2rem);
            font-weight: 600;
        }

        .status {
            color: var(--text-2);
            font-size: 1.02rem;
            line-height: 1.6;
        }

        .loader {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--glow);
            border-right-color: rgba(252, 163, 17, 0.3);
            animation: spin 1.2s linear infinite;
            position: relative;
        }

        .loader::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px dashed rgba(252, 163, 17, 0.35);
            animation: spin 2.4s linear infinite reverse;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.2rem;
            border-radius: 999px;
            text-decoration: none;
            color: var(--text-1);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--stroke);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .loading {
                padding: 36px 24px;
            }

            .eyebrow {
                letter-spacing: 0.2em;
            }
        }
    </style>
</head>
<body>
    <main class="loading" aria-live="polite">
        <div class="loader" aria-hidden="true"></div>
        <div class="loading-text">
            <p class="eyebrow">Hafta 1</p>
            <h1>Loading</h1>
            <p class="status">İlk commitlerde yer alan yükleme ekranı çalışması.</p>
        </div>
        <a href="index.html" class="back-link">Ana sayfaya dön</a>
    </main>
</body>
</html>
